<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List with Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 0.9em;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #addBtn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        #addBtn:hover {
            background: #5568d3;
        }

        #addBtn:active {
            transform: scale(0.98);
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .task-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .task-item.completed {
            background: #e8f5e9;
            opacity: 0.7;
        }

        .task-text {
            flex: 1;
            font-size: 1em;
            color: #333;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            font-weight: 600;
        }

        .done-btn {
            background: #4caf50;
            color: white;
        }

        .done-btn:hover {
            background: #45a049;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .delete-btn:hover {
            background: #da190b;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .task-item.completed .done-btn {
            background: #9e9e9e;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do List</h1>
        <p class="subtitle">Press Shift to add tasks quickly</p>
        
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a new task..."
                maxlength="100"
            >
            <button id="addBtn">Add Task</button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="stats" id="stats">
            <span id="totalTasks">0</span> Total | 
            <span id="completedTasks">0</span> Completed
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const totalTasksSpan = document.getElementById('totalTasks');
        const completedTasksSpan = document.getElementById('completedTasks');

        let tasks = [];
        let completedCount = 0;

        function playDingSound() {
            const audio = new Audio('ding.mp3');
            audio.volume = 0.5;
            audio.play().catch(err => console.log('Audio play failed:', err));
        }

        function updateStats() {
            totalTasksSpan.textContent = tasks.length;
            completedTasksSpan.textContent = completedCount;
        }

        function createTaskElement(taskText, index) {
            const li = document.createElement('li');
            li.className = 'task-item';
            
            const taskSpan = document.createElement('span');
            taskSpan.className = 'task-text';
            taskSpan.textContent = taskText;
            
            const doneBtn = document.createElement('button');
            doneBtn.className = 'btn done-btn';
            doneBtn.textContent = '✓ Done';
            doneBtn.onclick = () => markDone(index);
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn delete-btn';
            deleteBtn.textContent = '✕ Delete';
            deleteBtn.onclick = () => deleteTask(index);
            
            li.appendChild(taskSpan);
            li.appendChild(doneBtn);
            li.appendChild(deleteBtn);
            
            return li;
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.textContent = 'No tasks yet. Add one to get started!';
                taskList.appendChild(emptyState);
            } else {
                tasks.forEach((task, index) => {
                    const taskElement = createTaskElement(task.text, index);
                    if (task.completed) {
                        taskElement.classList.add('completed');
                        taskElement.querySelector('.done-btn').disabled = true;
                    }
                    taskList.appendChild(taskElement);
                });
            }
            
            updateStats();
        }

        function addTask() {
            const taskText = taskInput.value.trim();
            
            if (taskText === '') {
                alert('Please enter a task!');
                return;
            }
            
            tasks.push({
                text: taskText,
                completed: false
            });
            
            taskInput.value = '';
            taskInput.focus();
            renderTasks();
        }

        function markDone(index) {
            if (!tasks[index].completed) {
                tasks[index].completed = true;
                completedCount++;
                playDingSound();
                renderTasks();
            }
        }

        function deleteTask(index) {
            if (tasks[index].completed) {
                completedCount--;
            }
            tasks.splice(index, 1);
            renderTasks();
        }

        addBtn.addEventListener('click', addTask);

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Shift') {
                taskInput.focus();
            }
        });

        renderTasks();
    </script>
</body>
</html>
